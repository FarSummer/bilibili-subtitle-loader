<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>B站本地字幕加载器</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            line-height: 1.7;
            color: #333;
        }
        h1 { color: #fb7299; }
        a.install {
            display: inline-block;
            background: #fb7299;
            color: #fff;
            padding: 10px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            margin: 16px 0;
        }
        a.install:hover { background: #fc8aad; }
        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>B站本地字幕加载器</h1>
    <p>一个篡改猴脚本，让你在 B 站视频页面加载本地 ASS/SRT 字幕。</p>

    <a class="install" href="bilibili-subtitle-loader.user.js">点击安装脚本</a>

    <h2>使用步骤</h2>
    <ol>
        <li>确保已安装篡改猴扩展</li>
        <li>点击上方按钮安装脚本</li>
        <li>打开 B 站视频页，点击工具栏的"加载字幕"</li>
        <li>选择本地字幕文件</li>
    </ol>

    <h2>支持格式</h2>
    <p><code>.srt</code> <code>.ass</code> <code>.vtt</code></p>

    <p><a href="https://github.com/你的用户名/你的仓库名">查看 GitHub 仓库</a></p>
</body>
</html>
